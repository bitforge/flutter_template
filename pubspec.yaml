name: flutter_template
description: Bitforge Flutter Template
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  app_settings: ^5.1.1
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  easy_localization: ^3.0.7
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_riverpod: ^2.6.1
  gap: ^3.0.1
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  package_info_plus: ^8.1.1
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  custom_lint: ^0.7.0
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.2
  flutter_test:
    sdk: flutter
  riverpod_lint: ^2.6.2
  test: ^1.24.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
